<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Edge Detection Model</title>
  <desc id="desc">Illustration of an OpenCV edge detection preview</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#40513B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect x="40" y="40" width="270" height="320" rx="16" fill="#0f1a10"/>
  <circle cx="175" cy="170" r="70" fill="none" stroke="#A4BE7B" stroke-width="8"/>
  <rect x="95" y="250" width="160" height="18" rx="4" fill="#609966"/>
  <rect x="115" y="278" width="120" height="10" rx="4" fill="#9DC08B"/>
  <rect x="330" y="40" width="270" height="320" rx="16" fill="#07100a"/>
  <polyline points="360,280 400,160 430,220 470,110 510,200 560,90" fill="none" stroke="#c9e0a8" stroke-width="4"/>
  <polyline points="360,300 420,210 455,250 500,150 545,230" fill="none" stroke="#609966" stroke-width="3"/>
  <text x="465" y="340" text-anchor="middle" fill="#EDF1D6" font-family="Outfit, sans-serif" font-size="16">OpenCV edges</text>
</svg>
